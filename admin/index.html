<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>타임어택 백오피스</title>
  <link rel="icon" href="../assets/gpt/favicon.png" />

<body>

      <button class="btn primary" id="google-login" type="button">Google 계정으로 로그인</button>
      <div class="err" id="login-err"></div>

  </div>
  <div id="shell" hidden>
    <aside id="side">
      <div class="brand"><img src="../assets/gpt/ui_crown.png" alt="" /><div><b id="series-title">타임어택</b><small>백오피스</small></div></div>
      <nav>
        <a href="#/dashboard" data-r="dashboard">📊 대시보드</a>
        <a href="#/questions" data-r="questions">📚 문항 관리</a>
        <a href="#/import" data-r="import">⇅ 가져오기 / 내보내기</a>

      </nav>
      <div class="side-foot">
        <a href="../" target="_blank">사용자 화면 열기 ↗</a><span id="who" style="color:var(--ink-3);word-break:break-all"></span>
        <a href="../docs/SCORING.md" target="_blank">점수 규칙 문서 ↗</a>
        <button id="logout">로그아웃</button>

    </aside>
    <main id="main"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="toast"></div>
  <script src="admin.js" type="module"></script>
